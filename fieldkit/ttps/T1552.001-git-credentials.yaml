# Git credential caches → source access + supply-chain reach
#
# ~/.git-credentials (from `git config credential.helper store`)
# stores repo URLs with embedded username:password in cleartext.
# ~/.config/gh/hosts.yml holds GitHub CLI OAuth tokens the same
# way. Reading either gives an operator source access — often
# spanning many repos beyond what the foothold was intended to
# reach — plus supply-chain positioning (push a malicious commit).
#
# Genuinely new coverage.
technique: T1552.001
name: git credential caches → source access
tactic: [credential-access, lateral-movement]
platform: [linux]
key: loot:git-credentials
ranking:
  exploitability: medium
  safety: read-only
  detection: quiet
detect:
  always: true
execute:
  # Cat every known git credential cache. `git-credentials` is
  # line-oriented URLs (https://user:pass@host/…); `hosts.yml` is
  # YAML with an oauth_token field. Both leak credentials on
  # cat.
  command: |-
    for f in /root/.git-credentials /root/.config/gh/hosts.yml /root/.config/git/credentials /home/*/.git-credentials /home/*/.config/gh/hosts.yml /home/*/.config/git/credentials; do [ -r "$f" ] && echo "=== $f ===" && cat "$f" 2>/dev/null; done
verify:
  # Any credential file's contents will contain either a URL
  # scheme or an oauth_token line.
  success: "://"
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "git or gh credential cache present + readable"
  description: >
    `git config credential.helper store` writes repo URLs with
    embedded username:password to ~/.git-credentials in cleartext.
    GitHub CLI (`gh auth login`) writes OAuth tokens to
    ~/.config/gh/hosts.yml. Both give an operator immediate
    source-repository access with the credential's original scope,
    which typically spans the user's whole org / GitHub personal
    reach — a lateral pivot into every codebase and a supply-chain
    push position.
  remediation: >
    Use `credential.helper cache` (in-memory, expiring) instead of
    `store` — or switch to SSH keys with per-key `IdentityFile` +
    hardware-backed auth (yubikey / Secretive). Rotate any found
    token immediately; the pattern of "one user's git creds work
    on 200 repos" is exactly what makes this a lateral primitive.
  refs: [T1552.001, T1552.004, unsecured-credentials]
