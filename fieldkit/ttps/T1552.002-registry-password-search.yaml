# Registry password search → credentials
#
# Software installers, admin scripts, and management agents write
# passwords to the registry as plain REG_SZ values astonishingly
# often — installer defaults never cleaned up, VNC/AutoLogon
# passwords, third-party service creds, ODBC connection strings.
# `reg query /f password /s` walks the tree and matches on value
# name OR data — one command surfaces the whole class.
#
# Genuinely new coverage — Windows mirror of the Linux
# shell-history-creds hunt in C2.
technique: T1552.002
name: Windows registry password search → credentials
tactic: [credential-access]
platform: [windows]
key: loot:win-registry-password-search
ranking:
  exploitability: medium         # depends on what an admin wrote there
  safety: read-only              # reg query, no writes
  detection: quiet                # unremarkable admin-console activity
detect:
  always: true
execute:
  # /f "password" matches the string in value NAMES + DATA (`/d` alone
  # would only match data). /s recurses. Both HKLM (software configs)
  # and HKCU (user-scope AutoLogon, RDP saved creds) — separate
  # queries so a stripped-down box that hides one doesn't abort the
  # other. `findstr /v Description` drops the noise from string-table
  # descriptions that contain "password" (dozens of hits per host).
  command: |-
    reg query HKLM /f "password" /t REG_SZ /s 2>nul | findstr /v /i "description" & reg query HKCU /f "password" /t REG_SZ /s 2>nul | findstr /v /i "description"
verify:
  # Any hit produces `REG_SZ` in the line.
  success: "REG_SZ"
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "one or more registry values contain a password-shaped string"
  description: >
    Software installers, admin scripts, VNC/AutoLogon config, RDP
    saved credentials, and management-agent settings leak
    passwords into the registry as plain REG_SZ values.
    `reg query /f password /t REG_SZ /s` walks both HKLM and HKCU
    and surfaces the whole class in one call.
  remediation: >
    Sweep registry for password-shaped values under a maintenance
    window and rotate anything found. Prefer DPAPI-protected
    storage via the Windows Credential Manager, or the Local
    Security Authority secret store for service accounts. Never
    store passwords in AutoLogon (the DefaultPassword value is
    plaintext, not DPAPI).
  refs: [T1552.002, unsecured-credentials-in-registry]
