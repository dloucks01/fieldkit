# Browser credential stores → saved passwords + cookies
#
# Chrome/Edge/Brave/Firefox all keep encrypted-at-rest credential
# stores that decrypt with the logged-on user's DPAPI key
# (Chromium-family) or a master key file (Firefox). If the operator
# footholds an interactive user's account (or a service account
# that ever logged into a browser), reading these files gives
# saved website passwords + session cookies for lateral movement.
#
# Genuinely new coverage — Windows mirror of C2 cloud-credentials
# (browser stores hold cloud console session cookies too).
technique: T1555.003
name: browser credential stores → saved passwords + cookies
tactic: [credential-access, lateral-movement]
platform: [windows]
key: loot:win-browser-credentials
ranking:
  exploitability: medium
  safety: read-only
  detection: quiet
detect:
  always: true
execute:
  # dir surfaces the credential DB paths for each browser under
  # every profile. Two dir invocations (Chrome/Edge share Local
  # State + Login Data; Firefox uses key4.db + logins.json) with
  # /s for subdir walk. `%USERPROFILE%\..` catches other users'
  # profiles when the foothold has read on \Users.
  command: |-
    dir /s /b "%USERPROFILE%\..\*\AppData\Local\Google\Chrome\User Data\*\Login Data" "%USERPROFILE%\..\*\AppData\Local\Microsoft\Edge\User Data\*\Login Data" "%USERPROFILE%\..\*\AppData\Local\BraveSoftware\Brave-Browser\User Data\*\Login Data" 2>nul & dir /s /b "%USERPROFILE%\..\*\AppData\Roaming\Mozilla\Firefox\Profiles\*\key4.db" "%USERPROFILE%\..\*\AppData\Roaming\Mozilla\Firefox\Profiles\*\logins.json" 2>nul
verify:
  # Any hit prints a full path.
  success: ":\\"
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "one or more browser credential DBs present + readable"
  description: >
    Chrome / Edge / Brave keep saved passwords in
    `AppData\Local\...\Login Data` (SQLite; per-row DPAPI-encrypted
    with the user's key from Local State). Firefox uses `key4.db`
    + `logins.json`. Reading either as (or via impersonation of)
    the owning user decrypts to plaintext website credentials +
    cookies — the cookies alone often bypass MFA to cloud
    consoles the user signed into.
  remediation: >
    Disable browser password managers via GPO
    (`Software\Policies\Google\Chrome\PasswordManagerEnabled=0`
    and equivalents for Edge / Firefox) on privileged workstations.
    Where users must save site credentials, standardize on a
    hardware-backed manager (1Password/Bitwarden with WebAuthn) so
    a filesystem read has no value.
  refs: [T1555.003, browser-credential-stores]
