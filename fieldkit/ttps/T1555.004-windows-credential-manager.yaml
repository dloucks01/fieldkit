# Windows Credential Manager → cached credentials
#
# `cmdkey /list` shows every credential the current user has
# saved into Windows Credential Manager — RDP targets ("Domain
# password" type), network shares, and any app that called
# CredWrite. The credential DATA itself is DPAPI-encrypted and
# reads out via `runas /savecred` or an equivalent DPAPI unlock,
# but the ENUMERATION is a free lateral-movement map: every
# host the user has RDP'd to, every share they've mounted.
#
# Genuinely new coverage — Windows mirror of C2's git-credentials.
technique: T1555.004
name: Windows Credential Manager → cached RDP + share credentials
tactic: [credential-access, lateral-movement, discovery]
platform: [windows]
key: loot:win-credential-manager
ranking:
  exploitability: medium
  safety: read-only
  detection: quiet
detect:
  always: true
execute:
  # cmdkey enumerates the credential names + types; vaultcmd
  # (Windows 8+) covers the newer Web / Modern-App vault which
  # cmdkey misses. Both are read-only.
  command: |-
    cmdkey /list 2>nul & vaultcmd /listcreds:"Windows Credentials" 2>nul & vaultcmd /listcreds:"Web Credentials" 2>nul
verify:
  # Non-empty vault produces "Target:" (cmdkey) or "Resource:"
  # (vaultcmd) — either is a hit.
  success: "Target:"
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "Windows Credential Manager has one or more cached credentials"
  description: >
    Every credential the user has ever saved via mstsc "Remember
    me", `net use /persistent`, or any app calling CredWrite is
    enumerable via `cmdkey /list` and (for the newer vault)
    `vaultcmd`. The credential data is DPAPI-encrypted, but the
    target list is a free lateral map — every RDP host and every
    share the user has authenticated to. Combined with a DPAPI
    unlock (`runas /savecred cmd.exe`), the credentials themselves
    become usable.
  remediation: >
    Discourage "Remember me" on mstsc via GPO
    (`DisablePasswordSaving=1` under Terminal Services). For
    service accounts, don't cache network credentials — use
    Kerberos delegation with restricted delegation targets so the
    ticket-caching model handles it without persistent secrets.
  refs: [T1555.004, credential-manager]
