# Web application config files → database + service credentials
#
# Web apps store database passwords, API keys, and cookie secrets
# in known config files under their document roots. wp-config.php
# for WordPress, .env for Laravel / Rails / Node, database.yml for
# Rails, settings.py / local_settings.py for Django, config.php for
# various CMSes. A foothold with read on the webroot inherits the
# db + service credentials, which lateral-move into whatever the
# app touches (usually a shared database with other apps' data).
#
# Genuinely new coverage.
technique: T1552.001
name: web application config files → db + service credentials
tactic: [credential-access, lateral-movement]
platform: [linux]
key: loot:webapp-config-secrets
ranking:
  exploitability: medium
  safety: read-only
  detection: quiet
detect:
  always: true
execute:
  # find covers the common webroots plus /opt and /srv where custom
  # deployments land. `-readable` filters to files the foothold can
  # actually cat; `-size -1M` skips huge log files matching the
  # glob. Then grep for credential-shaped lines from the matches.
  command: |-
    find /var/www /srv /opt /home -maxdepth 6 -type f \( -name '.env*' -o -name 'wp-config.php' -o -name 'database.yml' -o -name 'local_settings.py' -o -name 'settings.py' -o -name 'config.php' -o -name 'application.yml' -o -name 'application.properties' \) -readable -size -1M 2>/dev/null | while read f; do echo "=== $f ==="; grep -iE '^[^#]*(password|passwd|pass=|secret|token|api[_-]?key|aws_|DATABASE_URL|DB_|REDIS_URL|SMTP_)' "$f" 2>/dev/null | head -20; done | head -100
verify:
  success: "="
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "web app config file(s) with credential-shaped keys present + readable"
  description: >
    Web application config files under document roots (wp-config.php,
    .env, database.yml, local_settings.py, config.php) contain
    database passwords, API keys, mail-server credentials, and
    cookie signing secrets in cleartext. A foothold user (typically
    the webserver's uid, or a deploy account) can read them and
    move laterally into every service the app talks to. This is
    the #1 credential-access primitive on any linux webserver.
  remediation: >
    Move secrets out of on-disk config into a runtime secret store
    (Vault, AWS Secrets Manager, k8s Secrets, systemd credentials).
    Where at-rest config is unavoidable, restrict file mode to
    0400 owned by the app account only. Rotate any credential
    exposed by a config-file leak — assume the app account and
    the webserver logs both had access to it.
  refs: [T1552.001, unsecured-credentials]
