# Cloud SDK credential files → cloud access
#
# aws / gcloud / az / kubectl / doctl all cache long-lived API
# credentials in well-known files under the user's home. Once
# footholded on a box, reading these gives an operator immediate
# lateral access into the cloud environment — often with much
# broader privileges than the local user.
#
# Genuinely new coverage — no inlined predecessor.
technique: T1552.001
name: cloud SDK credential files → cloud access
tactic: [credential-access, lateral-movement]
platform: [linux]
key: loot:cloud-credentials
ranking:
  exploitability: medium            # if the file exists, the credential works
  safety: read-only
  detection: quiet
detect:
  always: true
execute:
  # ls -la surfaces the specific paths that exist — operator picks
  # which to `cat` next. This TTP is a "discovery" step; the actual
  # cat + parse is per-provider (aws credentials is INI, ~/.kube/config
  # is YAML with base64 tokens, etc.).
  command: |-
    ls -la /root/.aws/credentials /root/.aws/config /root/.config/gcloud/application_default_credentials.json /root/.config/gcloud/credentials.db /root/.azure/accessTokens.json /root/.azure/msal_token_cache.bin /root/.kube/config /root/.config/doctl/config.yaml /home/*/.aws/credentials /home/*/.aws/config /home/*/.config/gcloud/application_default_credentials.json /home/*/.config/gcloud/credentials.db /home/*/.azure/accessTokens.json /home/*/.azure/msal_token_cache.bin /home/*/.kube/config /home/*/.config/doctl/config.yaml 2>/dev/null
verify:
  # `-rw` or `-r--` in the ls output means at least one file exists
  # and is readable — the primitive works.
  success: "-r"
cleanup:
  command: ""
report:
  vector_type: exposed_secret
  evidence: "cloud SDK credential files present + readable"
  description: >
    AWS, GCP, Azure, Kubernetes, and DigitalOcean CLI tools all cache
    long-lived credentials under the user's home. A foothold user
    with read access to any of these files inherits the credential's
    scope — commonly IAM roles, cluster-admin tokens, or subscription
    contributor rights that dwarf the local foothold's authority.
  remediation: >
    Prefer short-lived SSO / OIDC / IMDS credentials over static
    long-lived tokens in home directories. Where long-lived
    credentials are unavoidable, restrict the file mode to 0400
    and consider aws-vault / gcloud-with-keyring for at-rest
    encryption. Treat any found file as a lateral-movement pivot
    — rotate the credential.
  refs: [T1552.001, T1552.005, unsecured-credentials]
