# SeLoadDriverPrivilege → BYOVD kernel r/w → SYSTEM
#
# This TTP is informational — the actual chain requires operator-selected
# vulnerable signed driver + its loader (both driver-specific). The vector
# renders in Analyze so the operator sees the privilege exists, but the
# TUI Escalate launcher should show the "needs" note rather than fire
# blindly; the actual BYOVD delivery lands via `fieldkit prep`.
technique: T1068
name: SeLoadDriver → BYOVD kernel r/w → SYSTEM
tactic: [privilege-escalation]
platform: [windows]
ranking:
  exploitability: high
  safety: crash-risk        # loading a vulnerable driver can BSOD
  detection: loud            # every EDR watches driver loads
detect:
  privilege: SeLoadDriverPrivilege
execute:
  command: |-
    echo BYOVD chain is driver-specific — stage the driver + its loader, then use fieldkit prep
verify:
  success: "BYOVD"          # honest placeholder — this is not a fire-blindly vector
cleanup:
  command: ""
report:
  vector_type: seloaddriver
  description: >
    A token with SeLoadDriver can load unsigned or vulnerable-signed drivers.
    Loading a known-vulnerable signed driver (BYOVD) exposes arbitrary
    kernel read/write, which trivially escalates to SYSTEM. The chain is
    driver-specific — this TTP surfaces the privilege; the operator selects
    the driver (LOLDrivers is a good catalog) and drives the load via
    `fieldkit prep`.
  remediation: >
    Restrict SeLoadDriver to tier-0. Enable HVCI (Hypervisor-Protected Code
    Integrity) and Microsoft Vulnerable Driver Blocklist. Audit driver
    installs.
  refs: [T1068, T1547.006, LOLDrivers]
