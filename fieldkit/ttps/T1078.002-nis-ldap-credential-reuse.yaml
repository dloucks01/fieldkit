technique: T1078.002
name: NIS / LDAP centralized auth → credential reuse pivot
key: lateral:nis-ldap-reuse
tactic: [lateral-movement, discovery]
platform: [linux]
ranking:
  exploitability: medium
  safety: read-only
  detection: quiet
detect:
  facts_match: {nis_or_ldap_auth: true}
execute:
  command: |-
    # The pivot: the local credential we hold likely reaches every
    # directory-joined host. The TTP surfaces WHICH directory + what
    # the operator can enumerate.
    grep -E '^(passwd|group|shadow):' /etc/nsswitch.conf 2>/dev/null
    echo "---"
    if command -v ypcat >/dev/null 2>&1; then
      echo "NIS passwd (first 5):"; ypcat passwd 2>/dev/null | head -5
    fi
    # SSSD config exposes LDAP URI + bind DN
    [ -r /etc/sssd/sssd.conf ] && grep -E '^(ldap_uri|ldap_search_base|ldap_default_bind_dn)' /etc/sssd/sssd.conf 2>/dev/null
verify:
  success: "passwd:"
cleanup:
  command: ""
report:
  vector_type: nis_ldap_reuse
  evidence: "nsswitch.conf names NIS / LDAP / SSSD for passwd+group"
  description: >
    When a host authenticates against a central NIS / LDAP / SSSD
    directory, every other host joined to the same directory accepts
    the same username/password pair. A credential cracked on ONE box
    sprays trivially across the entire fleet — a one-host compromise
    turns into fleet-wide lateral movement by discovery alone.
  remediation: >
    Prefer Kerberos / short-lived tokens over password-based directory
    auth. Enforce per-host account restrictions in sudoers / login.pam.
    Rotate the central directory's cached passwords periodically.
  refs: [T1078.002]
