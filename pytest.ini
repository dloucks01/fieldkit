[pytest]
# fieldkit's tests live in tests/. Don't let pytest walk into the staged third-party
# code under exploits/ (or the v1 archive/) and try to collect their test suites.
testpaths = tests
norecursedirs = exploits archive .git __pycache__

# `integration` marker gates tests that need a live lab (real DC / recce
# bridge / Windows box). They opt in via FIELDKIT_INTEGRATION_LAB pointing
# at a lab.yaml config; without it the tests skip. A bare `pytest` run
# never fires them; they need `-m integration` OR (better) the env var.
# See tests/integration/README.md.
markers =
    integration: needs a live lab (skipped without FIELDKIT_INTEGRATION_LAB)

# Default filter: exclude integration tests from bare `pytest` runs.
# CI's unit-test job inherits this. The integration job overrides with
# `pytest -m integration --override-ini "addopts="`.
addopts = -m "not integration"
