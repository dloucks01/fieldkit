# fieldkit — build & install metadata.
#
# Install from a clone:            pip install .        (or --editable for dev)
# Install from git:                 pipx install git+https://github.com/dloucks01/fieldkit.git
# Install from a released tag:      pipx install fieldkit           (once on PyPI)
#
# fieldkit is stdlib-only — this file exists so `pipx` can put `fieldkit` on PATH
# and manage the venv for you. No third-party runtime deps to resolve.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldkit"
version = "2.0.0.dev0"
description = "Stateful internal-AD execution engine that drives your existing pentest toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "David Loucks" }]
keywords = ["pentest", "active-directory", "netexec", "orchestrator", "engagement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
# Deliberately empty — fieldkit is Python-3-stdlib-only. The tools it DRIVES
# (netexec, impacket, msfvenom, openssl, psql, mongosh, pandoc, ...) are the
# operator's own kit and are checked at runtime by `fieldkit preflight`.
dependencies = []

[project.scripts]
fieldkit = "fieldkit.cli:main"

[project.urls]
Homepage = "https://github.com/dloucks01/fieldkit"
Issues = "https://github.com/dloucks01/fieldkit/issues"

[tool.setuptools]
packages = ["fieldkit"]
# ship the exploits manifest + fetch.sh with the package so `fieldkit arsenal`
# instructions still land the operator on a working recipe after a `pipx install`.
include-package-data = true

[tool.setuptools.package-data]
fieldkit = []

[tool.setuptools.exclude-package-data]
fieldkit = ["*.pyc", "__pycache__"]
